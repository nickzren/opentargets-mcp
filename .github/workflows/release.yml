name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  # Standalone entry point so registry publication can be run or retried on
  # its own, without re-releasing to PyPI.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish to the MCP registry (e.g. v0.6.0)'
        required: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Run offline tests
        run: uv run pytest tests/ -v -m "not live"

  # Only the schema check gates a tag; the full live suite runs in CI, where an
  # upstream blip cannot block a release.
  schema:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate queries against the live API schema
        run: uv run pytest tests/test_query_schema.py -v -m live

  release:
    needs: [test, schema]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"

      - name: Build package
        run: uv build

      - name: Smoke-test the wheel
        run: uvx --from dist/*.whl opentargets-mcp --list-tools >/dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1

  publish-registry:
    # Runs after a successful PyPI release, and can be invoked on its own via
    # workflow_dispatch to retry or to publish a tag released earlier.
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for MCP registry OIDC authentication

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Pinned rather than `releases/latest`: a mutable download makes runs
      # unreproducible, which is how an unpinned linter broke CI earlier.
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: 1.8.1
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}"
          asset="mcp-publisher_linux_amd64.tar.gz"   # assets are unversioned
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/registry_${PUBLISHER_VERSION}_checksums.txt"
          grep " ${asset}$" checksums.txt | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          ./mcp-publisher --version

      # Validate before authenticating or publishing, so a malformed manifest
      # fails fast rather than part-way through a publish.
      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
