name: Monitor published package

# Daily runs reconcile real alerts; manual dispatches default to a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print proposed issue changes without making any'
        type: boolean
        default: true
      canary:
        description: >-
          Exercise the issue lifecycle against a synthetic condition. Requires
          dry_run=false; the combination is rejected before any write.
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *'  # daily at 06:17 UTC

permissions:
  contents: read
  issues: write

# Reconciliation reads the issue list and then writes to it, so two overlapping
# runs could both see no issue and both create one. Serialise instead of
# cancelling: cancelling mid-write could leave an issue created but unrecorded.
concurrency:
  group: monitor-published-package
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run monitoring checks
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled runs post; dispatches honour the input, defaulting to dry.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CANARY: ${{ inputs.canary || 'false' }}
        run: |
          set -euo pipefail
          args=()
          # Both flags are passed as selected. The CLI rejects the combination,
          # so requesting a canary without clearing dry_run fails loudly rather
          # than quietly running something that writes nothing.
          if [ "${CANARY}" = "true" ]; then
            args+=(--canary)
          fi
          if [ "${DRY_RUN}" != "false" ]; then
            args+=(--dry-run)
          fi
          python -m monitoring.cli "${args[@]}"

  # Validates every query on the default branch against the live API, so an
  # Open Targets data release that removes a field fails this run.
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate queries against the live API schema
        run: uv run pytest tests/test_query_schema.py -v -m live
