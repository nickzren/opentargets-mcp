[project]
name = "opentargets-mcp"
version = "0.6.0"
description = "MCP server for Open Targets Platform biomedical data access"
authors = [{name = "Nick Ren"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["mcp", "open-targets", "biomedical", "drug-discovery", "genetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.2,<4",
    "aiohttp",
    "graphql-core>=3.2",
    "python-dotenv",
    "pydantic-settings>=2.0",
    "thefuzz",
    "python-Levenshtein",
]

[project.scripts]
opentargets-mcp = "opentargets_mcp.server:main"

[project.urls]
Homepage = "https://github.com/nickzren/opentargets-mcp"
Repository = "https://github.com/nickzren/opentargets-mcp"
Documentation = "https://github.com/nickzren/opentargets-mcp#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "mcp",
    "pytest",
    "pytest-asyncio",
    "black",
    # Pinned: uv.lock is gitignored, so CI resolves dev tools fresh on every
    # run. An unpinned ruff silently adopted new default rules between the
    # last push to main (2026-05-15) and this one, failing CI on pre-existing
    # code. The minor bound is deliberate: ruff adds rules in minor releases.
    "ruff>=0.11.13,<0.12",
]
examples = [
    "openai",
]
